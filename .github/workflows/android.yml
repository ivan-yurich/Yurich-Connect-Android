name: Android quality and release

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.41.9
  JAVA_VERSION: "17"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - uses: gradle/actions/wrapper-validation@v4
      - name: Install Flutter
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: |
          chmod +x android/gradlew
          flutter pub get
      - name: Static analysis
        run: flutter analyze --no-pub
      - name: Flutter tests
        run: flutter test --no-pub
      - name: Kotlin tests
        run: ./android/gradlew -p android :flutter_singbox_vpn:testDebugUnitTest
      - name: Android lint
        run: ./android/gradlew -p android lintGithubDebug lintPlayDebug
      - name: Verify release shrinker builds
        run: |
          flutter build apk --release --flavor github --no-pub
          flutter build appbundle --release --flavor play --no-pub
      - name: Upload unsigned verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-android-verification
          if-no-files-found: error
          retention-days: 7
          path: |
            build/app/outputs/flutter-apk/*github-release*.apk
            build/app/outputs/bundle/playRelease/*.aab

  signed-release:
    if: github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: android-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - uses: gradle/actions/wrapper-validation@v4
      - name: Install Flutter
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          {
            echo "storeFile=../upload-keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      - name: Resolve dependencies
        run: |
          chmod +x android/gradlew
          flutter pub get
      - name: Build signed GitHub APK
        run: flutter build apk --release --flavor github --no-pub
      - name: Build signed Play bundle
        run: flutter build appbundle --release --flavor play --no-pub
      - name: Verify signatures
        run: |
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose --print-certs build/app/outputs/flutter-apk/app-github-release.apk
          jarsigner -verify -verbose -certs build/app/outputs/bundle/playRelease/app-play-release.aab
      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-android-release
          if-no-files-found: error
          retention-days: 30
          path: |
            build/app/outputs/flutter-apk/app-github-release.apk
            build/app/outputs/bundle/playRelease/app-play-release.aab
